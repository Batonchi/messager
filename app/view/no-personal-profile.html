<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoYour profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC:wght@300;400;700&family=Lilita+One&display=swap" rel="stylesheet">
</head>
<body>
    <img src="/static/images/profile/background.svg" alt="конь в пальто" class="background" oncontextmenu="return false;">
    <input type="hidden" id="current_user_id" value="{{current_user_id}}">
    <section class="forward">
        <div class="logo"><img src="/static/images/profile/title.svg" alt=""></div>
        <div class="wild-flex">
            <form action="" class="data" method="get">
                <input type="text" name="first_name" placeholder="Имя" readonly>
                <input type="text" name="last_name" placeholder="Фамилия" readonly>
                <input type="date" name="birth_date" placeholder="Дата Рождения" readonly>
                <textarea maxlength="300"  type="text"  class="about" name="about" placeholder="О себе" readonly></textarea>
            </form>
            <div class="flex_buttons">
                <div class="photo-of-profile" id="photo-of-profile">
                    <img src="" alt="">
                    <div><a href="">ДРУЗЬЯ</a></div>
                </div>
                <button><a href="">ДОБАВИТЬ В ДРУЗЬЯ</a></button>
                <button><a href="">ВЫЙТИ</a></button>
            </div>
        </div>
    </section>
    <style>
        .photo-of-profile {
            bottom: 129px !important;
        }
        button {
            height: 60px !important;
        }
    </style>
    <link rel="stylesheet" href="/static/css/profile.css">
    <script src="/static/js/no-personal-profile.js"></script>
</body>
</html>
